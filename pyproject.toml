[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "span"
version = "0.0.0"
description = "Span — semantic repository intelligence for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = ["mcp==2.3.0"]

[project.scripts]
span-mcp = "span.shell.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["span"]
