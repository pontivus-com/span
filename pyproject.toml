[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "span-mcp"
dynamic = ["version"]
description = "Span — maintained codebase understanding for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Rolf Streefkerk", email = "r.streefkerk@gmail.com" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "coding-agents",
  "codebase-understanding",
  "semantic-memory",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp==2.3.0"]

[project.urls]
Homepage = "https://github.com/pontivus-com/span"
Repository = "https://github.com/pontivus-com/span"
Issues = "https://github.com/pontivus-com/span/issues"
Changelog = "https://github.com/pontivus-com/span/blob/master/CHANGELOG.md"

[project.scripts]
span-mcp = "span.shell.mcp_server:main"
span-install = "span.shell.install:main"
span-hooks = "span.shell.hooks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[project.optional-dependencies]
test = ["pytest"]
dev = [
  "black==26.10.1",
  "mypy==2.4.0",
  "ruff==0.17.1",
  "coverage[toml]>=7.17,<8",
]

[tool.black]
target-version = ["py312"]
line-length = 88
extend-exclude = '''
/(
  \.context
| \.tmp-e2e
| \.tmp-freshclone
| docs/acceptance-evidence
| graft
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".context",
  ".tmp-e2e",
  ".tmp-freshclone",
  "docs/acceptance-evidence",
  "graft",
]

[tool.ruff.lint]
select = ["E", "F"]
# Line length is owned by black; ruff stays on correctness rules.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These tests put the repository root on ``sys.path`` before importing span.
"tests/unit/test_agents_snippet.py" = ["E402"]
"tests/unit/test_hooks_runner.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
exclude = ["^\\.context", "^graft", "^build", "^dist", "^\\.venv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "span.__version__" }

[tool.setuptools.package-data]
span = [
    "BUILD_IDENTITY",
    "_assets/agents-snippet.md",
    "_assets/skills/span/SKILL.md",
    "_assets/skills/span-change-context/SKILL.md",
    "_assets/skills/span-document/SKILL.md",
]

[tool.coverage.run]
source = ["span"]
