[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "span-mcp"
dynamic = ["version"]
description = "Span — maintained codebase understanding for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rolf Streefkerk", email = "r.streefkerk@gmail.com" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "coding-agents",
  "codebase-understanding",
  "semantic-memory",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp==2.3.0"]

[project.urls]
Homepage = "https://github.com/pontivus-com/span"
Repository = "https://github.com/pontivus-com/span"
Issues = "https://github.com/pontivus-com/span/issues"
Changelog = "https://github.com/pontivus-com/span/blob/master/CHANGELOG.md"

[project.scripts]
span-mcp = "span.shell.mcp_server:main"
span-install = "span.shell.install:main"
span-hooks = "span.shell.hooks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "span.__version__" }

[tool.setuptools.package-data]
span = ["BUILD_IDENTITY"]

[tool.coverage.run]
source = ["span"]
