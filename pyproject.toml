[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "span"
dynamic = ["version"]
description = "Span — semantic repository intelligence for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = ["mcp==2.3.0"]

[project.scripts]
span-mcp = "span.shell.mcp_server:main"
span-install = "span.shell.install:main"
span-hooks = "span.shell.hooks:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "span.__version__" }

[tool.setuptools.package-data]
span = ["BUILD_IDENTITY"]

[tool.coverage.run]
source = ["span"]
