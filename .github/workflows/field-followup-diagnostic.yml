name: Temporary field follow-up diagnostic
on: [push]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: pip install -e '.[test,dev]'
      - name: Format and measure
        run: |
          black .
          git diff
          python - <<'PY'
          import runpy, json
          print(json.dumps(runpy.run_path("tests/unit/test_code_budget.py")["measure"](), sort_keys=True))
          PY
          ruff check .
      - name: Typing
        run: python scripts/typecheck.py
      - name: Focused tests
        if: always()
        run: pytest -q tests/unit/test_install.py tests/unit/test_administrative_readiness.py tests/unit/test_beta3_initialization_regressions.py
      - name: Host tests
        if: always()
        run: node --test tests/plugin/test_span_hooks_notice.mjs
