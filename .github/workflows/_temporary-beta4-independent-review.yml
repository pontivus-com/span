name: Temporary Beta 4 independent review request

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/_temporary-beta4-independent-review.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  request-copilot-review:
    if: contains(github.event.head_commit.message, 'trigger Beta 4 independent Copilot review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Copilot review for review-only PR 50
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "50"
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/copilot-review-response.json"
          status=$(curl -sS             -o "${response_file}"             -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}/copilot-code-review"             -d '{}')
          cat "${response_file}"
          if [[ "${status}" != "201" && "${status}" != "409" ]]; then
            echo "Copilot review request failed with HTTP ${status}" >&2
            exit 1
          fi
          echo "Copilot review request accepted with HTTP ${status}"
