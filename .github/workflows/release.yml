name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the release version
        id: resolve
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '__version__' src/span/__init__.py | cut -d'"' -f2)
          tag="v${version}"
          sha=$(git rev-parse HEAD)
          if [[ "${REF_TYPE}" == "tag" ]]; then
            if [[ "${REF_NAME}" != "${tag}" ]]; then
              echo "tag ${REF_NAME} does not match package version ${version}" >&2
              exit 1
            fi
            release=true
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; no release"
            release=false
          elif [[ "${version}" == *dev* ]]; then
            echo "development version ${version}; no release"
            release=false
          else
            release=true
          fi
          {
            echo "release=${release}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=${sha}"
          } >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/build_identity.py
          python -m build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/span-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # PyPI trusted publishing: no token is stored. The publish action also
      # sends the PEP 740 attestation generated from the OIDC identity.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: [resolve, publish]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      # The tag is created only after PyPI accepted the version, so a failed
      # build or publish leaves the version untagged and re-runnable.
      - name: Create the release tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Span ${VERSION}"
          git push origin "${TAG}"

  github-release:
    needs: [resolve, tag]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Extract the changelog section
        run: python scripts/release_notes.py "${{ needs.resolve.outputs.version }}" > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          args=(--verify-tag --title "Span ${VERSION}" --notes-file release-notes.md)
          if [[ "${VERSION}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"

  registry:
    needs: [resolve, publish]
    if: needs.resolve.outputs.release == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
