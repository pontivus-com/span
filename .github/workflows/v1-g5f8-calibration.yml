name: Version-1 G5F8 Measurement Calibration

on:
  push:
    branches:
      - design/1.0-beta-functional-pyramid

permissions:
  contents: read
  copilot-requests: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Probe JSON usage output
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          copilot -p "Reply exactly: OK"             --model gpt-5.2             --output-format json             --no-custom-instructions             --no-ask-user             > /tmp/copilot-probe.jsonl
          cat /tmp/copilot-probe.jsonl
