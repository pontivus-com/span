name: Publish to MCP Registry

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # One source of truth: derive both ecosystem serializations from the
      # canonical PEP-440 package version. The registry server version is SemVer;
      # the PyPI package coordinate retains the exact package version.
      - name: Set registry and package versions from the canonical package version
        run: |
          package_version=$(python scripts/release_identity.py --field package_version)
          registry_version=$(python scripts/release_identity.py --field registry_version)
          jq --arg v "$registry_version" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
          jq --arg v "$package_version" '.packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          grep -E '"version"' server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish server metadata
        run: ./mcp-publisher publish
