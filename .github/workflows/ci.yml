name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Read the managed indexer pin
        id: indexer-pin
        run: |
          version=$(grep -m1 'STRUCTURAL_INDEXER_VERSION = ' \
            src/span/shell/install/constants.py | cut -d'"' -f2)
          package=$(grep -m1 'STRUCTURAL_INDEXER_PACKAGE = ' \
            src/span/shell/install/constants.py | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Cache the npm indexer download
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-graft-${{ steps.indexer-pin.outputs.version }}
          restore-keys: |
            npm-${{ runner.os }}-graft-

      - name: Cache uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,dev]'

      # The installed-MCP lane drives a real install over stdio, so the
      # managed structural indexer must exist before the tests run. The
      # installer provisions it for end users; CI provisions the same
      # pinned package and points the server at it through the documented
      # SPAN_GRAFT_BIN override.
      - name: Provision the managed structural indexer
        run: |
          npm install --prefix "$RUNNER_TEMP/span-tools" \
            --no-audit --no-fund \
            "${{ steps.indexer-pin.outputs.package }}@${{ steps.indexer-pin.outputs.version }}"
          echo "SPAN_GRAFT_BIN=$RUNNER_TEMP/span-tools/node_modules/.bin/graft" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/span-tools/node_modules/.bin/graft" --version

      - name: Diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero}" ]]; then
            git diff --check "${BEFORE_SHA}..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Lint and format
        run: |
          ruff check .
          black --check --diff .

      - name: Typing ratchet
        run: |
          python scripts/typecheck.py

      - name: Test
        run: |
          coverage run -m pytest -q
          coverage report --show-missing
          coverage xml

      # FD-53: the edit-time notice must be shown to reach event.system.
      # This is the named capture artifact, run in CI where Node is available.
      - name: Plugin notice delivery
        run: node --test tests/plugin/test_span_hooks_notice.mjs

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/build_identity.py
          python -m build

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          sdists = sorted(dist.glob("*.tar.gz"))
          wheels = sorted(dist.glob("*.whl"))
          if len(sdists) != 1 or len(wheels) != 1:
              raise SystemExit(
                  f"expected one sdist and one wheel, got {sdists!r} and {wheels!r}"
              )

          def validate_paths(names, label):
              for raw in names:
                  path = raw.replace("\\", "/")
                  parts = path.split("/")
                  if path.startswith("/") or ".." in parts:
                      raise SystemExit(f"{label} contains unsafe archive path: {raw}")

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = archive.getnames()
          validate_paths(sdist_names, "sdist")
          for suffix in (
              "/pyproject.toml",
              "/README.md",
              "/src/span/__init__.py",
              "/src/span/BUILD_IDENTITY",
          ):
              if not any(name.endswith(suffix) for name in sdist_names):
                  raise SystemExit(f"sdist missing required content: {suffix}")

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = archive.namelist()
          validate_paths(wheel_names, "wheel")
          for required in ("span/__init__.py", "span/BUILD_IDENTITY"):
              if required not in wheel_names:
                  raise SystemExit(f"wheel missing required content: {required}")

          print(sdists[0])
          print(wheels[0])
          PY

      - name: Check the distribution
        run: |
          python -m pip install dist/*.whl
          span-mcp --help
          python -c "import span; print(span.__version__)"
