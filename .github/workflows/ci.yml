name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Read the managed indexer pin
        id: indexer-pin
        run: |
          version=$(grep -m1 'STRUCTURAL_INDEXER_VERSION = ' \
            src/span/shell/install.py | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the npm indexer download
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-graft-${{ steps.indexer-pin.outputs.version }}
          restore-keys: |
            npm-${{ runner.os }}-graft-

      - name: Cache uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,dev]'

      - name: Lint and format
        run: |
          ruff check .
          black --check .

      - name: Test
        run: |
          coverage run -m pytest -q
          coverage report --show-missing
          coverage xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python scripts/build_identity.py
          python -m build

      - name: Check the distribution
        run: |
          python -m pip install dist/*.whl
          span-mcp --help
          python -c "import span; print(span.__version__)"
