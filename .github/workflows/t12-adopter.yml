name: Beta 2 T12 portable runtime

on:
  push:
    branches:
      - positioning/knowledge-factory-2026-11-23
    paths:
      - .github/workflows/t12-adopter.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Read managed structural-indexer pin
        id: indexer
        run: |
          version=$(grep -m1 'STRUCTURAL_INDEXER_VERSION = ' src/span/shell/install/constants.py | cut -d'"' -f2)
          package=$(grep -m1 'STRUCTURAL_INDEXER_PACKAGE = ' src/span/shell/install/constants.py | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Build offline Python wheelhouse
        run: |
          python -m pip install --upgrade pip
          mkdir -p t12-bundle/wheelhouse t12-bundle/source/src
          python -m pip wheel --wheel-dir t12-bundle/wheelhouse .
          cp -R src/span t12-bundle/source/src/span
          cp pyproject.toml t12-bundle/source/pyproject.toml

      - name: Bundle exact managed structural indexer
        run: |
          mkdir -p t12-bundle/tools
          npm install --prefix t12-bundle/tools --no-audit --no-fund \
            "${{ steps.indexer.outputs.package }}@${{ steps.indexer.outputs.version }}"
          t12-bundle/tools/node_modules/.bin/graft --version

      - name: Record candidate identity
        run: |
          {
            echo "span_sha=$GITHUB_SHA"
            echo "python=3.13"
            echo "indexer_package=${{ steps.indexer.outputs.package }}"
            echo "indexer_version=${{ steps.indexer.outputs.version }}"
          } > t12-bundle/manifest.txt

      - uses: actions/upload-artifact@v7
        with:
          name: span-t12-portable-runtime
          path: t12-bundle/
          if-no-files-found: error
