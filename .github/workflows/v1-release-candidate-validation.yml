name: Version-1 Release Candidate Validation

on:
  push:
    branches:
      - design/1.0-beta-functional-pyramid

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release identity and changelog extraction
        run: |
          set -euo pipefail
          test "$(python scripts/release_identity.py --field package_version)" = "1.0.0b1"
          test "$(python scripts/release_identity.py --field tag)" = "v1.0.0b1"
          test "$(python scripts/release_identity.py --field registry_version)" = "1.0.0-beta.1"
          test "$(python scripts/release_identity.py --field release_title)" = "Span 1.0.0 Beta 1"
          test "$(python scripts/release_identity.py --field prerelease)" = "true"
          python scripts/release_notes.py 1.0.0b1 > /tmp/release-notes.md
          grep -q '^## 1.0.0b1 — 2026-11-22$' /tmp/release-notes.md
          python - <<'PY'
          import json
          from pathlib import Path
          import span

          server = json.loads(Path("server.json").read_text(encoding="utf-8"))
          assert span.__version__ == "1.0.0b1"
          assert server["version"] == "1.0.0-beta.1"
          assert server["packages"][0]["version"] == "1.0.0b1"
          PY

      - name: Verify release-facing internal documentation links and status
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          files = [
              Path("README.md"),
              Path("AGENTS.md"),
              Path("INITIALIZATION_CONTRACT.md"),
              Path("SUPPORT.md"),
              Path("CONTRIBUTING.md"),
              *sorted(Path("docs").glob("*.md")),
              Path("docs/implementation-plans/1.0.0-beta.md"),
              *sorted(Path("skills").glob("*/SKILL.md")),
              *sorted(Path("integrations").glob("**/*.md")),
          ]

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          broken = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  target = target.strip().strip("<>")
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#", 1)[0].split("?", 1)[0]
                  if not target:
                      continue
                  resolved = (path.parent / target).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      broken.append((str(path), target, "outside repository"))
                      continue
                  if not resolved.exists():
                      broken.append((str(path), target, "missing"))
          if broken:
              raise SystemExit("broken internal links: " + repr(broken))

          current = "\n".join(
              p.read_text(encoding="utf-8")
              for p in [
                  Path("README.md"),
                  Path("docs/README.md"),
                  Path("docs/acceptance.md"),
                  Path("docs/technical-design.md"),
                  Path("docs/implementation-plans/1.0.0-beta.md"),
                  Path("integrations/hosts/triggers.md"),
              ]
          )
          forbidden = [
              "T11 remains the private adopter acceptance owner",
              "T11) is the next release gate",
              "Version-1 target; implementation pending",
              "sanitized generic T10/T11/T13 verification evidence",
              "visual audit complete — regeneration required",
          ]
          found = [value for value in forbidden if value in current]
          if found:
              raise SystemExit("stale Version-1 release status: " + repr(found))
          PY

      - name: Validate server.json with the release-time MCP publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
