name: Temporary governed initialization verification
on:
  push:
    branches: ['release/1.0.0-beta5']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install -e '.[test,dev]'
      - name: Focused tests
        run: python -m pytest -q tests/unit/test_functional_pyramid_v3_validation.py tests/unit/test_skills.py tests/unit/test_install.py
      - name: Format and measure exact candidate
        if: always()
        run: |
          black src/span/core/model/classification.py src/span/core/functional_pyramid.py tests/unit/test_functional_pyramid_v3_validation.py tests/unit/test_skills.py src/span/shell/install/receipt.py src/span/shell/install/cli.py tests/unit/test_install.py
          git diff -- src/span/core/model/classification.py src/span/core/functional_pyramid.py tests/unit/test_functional_pyramid_v3_validation.py tests/unit/test_skills.py src/span/shell/install/receipt.py src/span/shell/install/cli.py tests/unit/test_install.py
          python - <<'PY'
          import json, runpy
          print(json.dumps(runpy.run_path('tests/unit/test_code_budget.py')['measure'](), sort_keys=True))
          PY
      - name: Static checks
        if: always()
        run: |
          ruff check .
          python scripts/typecheck.py
